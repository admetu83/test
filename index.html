<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=400,height=150,initial-scale=1" />
    <title>Banner</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.yektanet.com/assets/3rdparty/gsap@3.12.5/gsap.min.js"></script>
</head>
<body>
    <div id="banner-content">

        <!-- Z:25 — Logo badge (self-backed pill, always visible) -->
        <div id="logoBadge">
            <img src="04.png" alt="" />
        </div>

        <!-- Z:5 — Panel (scenes 3–5) -->
        <div id="panel">
            <div id="panelContent">
                <div id="headlineText">با پلاس بیمه، حسابت پُره!</div>
                <div id="subText">درآمد +۱۰۰ میلیونی با فروش آنلاین بیمه</div>
            </div>
        </div>

        <!-- Bills injected by JS (z:10–13) -->

        <!-- Z:15 — Phone KV hero (on top of bills, below CTAs) -->
        <div id="phoneWrap">
            <img src="02.png" alt="" />
        </div>

        <!-- Z:30 — S1 + S4 CTA: کلیک کن! -->
        <img id="btn03" src="03.png" alt="" />

        <!-- Z:30 — S4 CTA: شروع کن! -->
        <img id="btn05" src="05.png" alt="" />

    </div>

    <script src="tags.js"></script>
    <script src="script.js"></script>
    <script>(function(){function gp(n){n=n.replace(/[\[]/,'\\[').replace(/[\]]/,'\\]');var r=new RegExp('[\\?&]'+n+'=([^&#]*)');var x=r.exec(location.search);return x===null?'':decodeURIComponent(x[1].replace(/\+/g,' '));}var cu=gp('click_url');if(cu){document.addEventListener('click',function(){window.open(cu,'_blank');});}})();</script>
</body>
</html>
