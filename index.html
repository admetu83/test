<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Plus Bimeh – Interactive Banner</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #b8b8b8;
      font-family: Tahoma, sans-serif;
    }

    /* ── Outer shell: exact video ratio 1920 : 3588 → 480 × 897 ── */
    .shell {
      position: relative;
      width: 480px;
      height: 897px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(0,0,0,.5);
    }

    /* ── Main stage ── */
    #stage {
      position: absolute; inset: 0;
      background: #080012;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── Phone frame images (full-bleed, RGBA transparent bg) ── */
    .ph {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      pointer-events: none;
      will-change: opacity, transform;
    }
    #ph1 { z-index: 4; opacity: 0; }
    #ph2 { z-index: 5; opacity: 0; }

    /* ── Screen region — banknotes live here, clipped to phone screen ──
       Tuned for modern iPhone mockup at 480 × 897:
       top ≈ 28 px  ·  sides ≈ 15 px  ·  bottom ≈ 22 px          */
    #screen {
      position: absolute;
      top:    3.1%;   /* ≈ 28 px */
      left:   3.1%;   /* ≈ 15 px */
      right:  3.1%;   /* ≈ 15 px */
      bottom: 2.5%;   /* ≈ 22 px */
      border-radius: 26px;
      overflow: hidden;
      z-index: 6;
      pointer-events: none;
    }

    /* overlay used for the "hint" glow */
    #hint {
      position: absolute; inset: 0;
      background: transparent;
      pointer-events: none;
      z-index: 80;
    }

    /* ── Brand logo (04.png – white mark, visible on dark / purple) ── */
    #logo {
      position: absolute;
      width: 58%;
      top: 11%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      will-change: opacity, transform;
    }

    /* ── CTA buttons ── */
    .cta {
      position: absolute;
      width: 70%;
      max-width: 315px;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%) scale(0);
      transform-origin: center bottom;
      z-index: 22;
      opacity: 0;
      cursor: pointer;
      filter: drop-shadow(0 5px 18px rgba(0,0,0,.55));
      will-change: transform, opacity, filter;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Banknote ── */
    .note {
      position: absolute;
      left: 5%;          /* centered: 5% + 90% width = 5% margin each side */
      width: 90%;
      height: 210px;
      object-fit: cover;
      object-position: center 55%;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,.7);
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* ── Ripple ── */
    .rip {
      position: absolute;
      width: 140px; height: 140px;
      margin: -70px 0 0 -70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,215,0,.75) 0%, transparent 65%);
      pointer-events: none;
      z-index: 50;
      animation: ripOut .95s ease-out forwards;
    }

    /* ── Gold coin particle ── */
    .coin {
      position: absolute;
      width: 16px; height: 16px;
      margin: -8px 0 0 -8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff176, #ffb300, #e65100);
      box-shadow: 0 0 8px rgba(255,193,7,.8);
      pointer-events: none;
      z-index: 51;
      animation: coinPop .8s cubic-bezier(.22,1,.36,1) forwards;
    }

    /* ────────── Keyframes ────────── */

    @keyframes ripOut {
      from { transform: scale(0); opacity: 1; }
      to   { transform: scale(3.2); opacity: 0; }
    }
    @keyframes coinPop {
      from { transform: translate(0,0) scale(1); opacity: 1; }
      to   { transform: translate(var(--dx), var(--dy)) scale(.1); opacity: 0; }
    }

    /* Phone intro — overshoot spring */
    @keyframes phEnter {
      0%   { opacity: 0; transform: scale(.88) translateY(20px); }
      62%  { transform: scale(1.03) translateY(-4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Logo slide down */
    @keyframes logoIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes logoOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    /* Button pop */
    @keyframes btnPop {
      0%   { opacity: 0; transform: translateX(-50%) scale(.22); }
      52%  { transform: translateX(-50%) scale(1.13); }
      76%  { transform: translateX(-50%) scale(.94); }
      91%  { transform: translateX(-50%) scale(1.05); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }
    @keyframes btnGlow {
      0%,100% { filter: drop-shadow(0 5px 14px rgba(34,197,94,.4)); }
      50%      { filter: drop-shadow(0 5px 32px rgba(34,197,94,.95)) drop-shadow(0 0 55px rgba(34,197,94,.3)); }
    }
    @keyframes btnOut {
      from { opacity: 1; transform: translateX(-50%) scale(1); }
      to   { opacity: 0; transform: translateX(-50%) scale(.65); }
    }

    /* Note fly-ins — all land at translateX(0) so left:5% is the rest position */
    @keyframes fromRight {
      0%   { opacity: 0; transform: translateX(590px) rotate(40deg) scale(.52); }
      52%  { opacity: 1; }
      80%  { transform: translateX(0) rotate(calc(var(--r) * 1deg - 2deg)) scale(1.05); }
      100% { opacity: 1; transform: translateX(0) rotate(calc(var(--r) * 1deg)) scale(1); }
    }
    @keyframes fromLeft {
      0%   { opacity: 0; transform: translateX(-590px) rotate(-40deg) scale(.52); }
      52%  { opacity: 1; }
      80%  { transform: translateX(0) rotate(calc(var(--r) * 1deg + 2deg)) scale(1.05); }
      100% { opacity: 1; transform: translateX(0) rotate(calc(var(--r) * 1deg)) scale(1); }
    }
    @keyframes fromBottom {
      0%   { opacity: 0; transform: translateX(0) translateY(520px) rotate(22deg) scale(.5); }
      52%  { opacity: 1; }
      80%  { transform: translateX(0) translateY(0) rotate(calc(var(--r) * 1deg - 2deg)) scale(1.05); }
      100% { opacity: 1; transform: translateX(0) translateY(0) rotate(calc(var(--r) * 1deg)) scale(1); }
    }
    @keyframes tapDrop {
      0%   { opacity: 0; transform: translateX(0) translateY(-140px) scale(.3)  rotate(calc(var(--r) * 1deg + 32deg)); }
      50%  { opacity: 1; transform: translateX(0) translateY(10px)   scale(1.08) rotate(calc(var(--r) * 1deg - 5deg)); }
      76%  { transform: translateX(0) translateY(-5px)  scale(.98)  rotate(calc(var(--r) * 1deg + 2deg)); }
      100% { opacity: 1; transform: translateX(0) translateY(0)     scale(1)    rotate(calc(var(--r) * 1deg)); }
    }

    /* Hint — faint gold glow on screen to nudge interactivity */
    @keyframes screenHint {
      0%,100% { background: transparent; }
      50%      { background: rgba(255,215,0,.13); }
    }
  </style>
</head>
<body>
<div class="shell">
  <div id="stage">

    <!-- Phone frames -->
    <img id="ph1" class="ph" src="assets/01.png" alt="">
    <img id="ph2" class="ph" src="assets/02.png" alt="">

    <!-- Screen region — holds banknotes, clips overflow -->
    <div id="screen">
      <div id="hint"></div>
    </div>

    <!-- Brand logo -->
    <img id="logo" src="assets/04.png" alt="BD Plus Bimeh">

    <!-- Phase-1 CTA: شروع کن! (05.png) -->
    <img id="btn1" class="cta" src="assets/05.png" alt="شروع کن">

    <!-- Phase-2 CTA: کلیک کن! (03.png) -->
    <img id="btn2" class="cta" src="assets/03.png" alt="کلیک کن">

  </div>
</div>

<script>
/* ─── refs ─── */
const stage  = document.getElementById('stage');
const ph1    = document.getElementById('ph1');
const ph2    = document.getElementById('ph2');
const scr    = document.getElementById('screen');
const hint   = document.getElementById('hint');
const logo   = document.getElementById('logo');
const btn1   = document.getElementById('btn1');
const btn2   = document.getElementById('btn2');

/* ─── state ─── */
let phase     = 0;
// 0 = init | 1 = phone-in | 2 = waiting-btn1
// 3 = waiting-btn2 | 4 = notes-flying | 5 = interactive
let timer     = null;
let noteCount = 0;
const MAX     = 12;
const srcs    = ['assets/05.jpg', 'assets/06.jpg'];

/* Note stack: top% within #screen, rotation (°), fly direction, image index
   Notes stack from bottom (60%) upward (27%) as count grows.              */
const stack = [
  // Phase-4 initial 4 notes
  { t: 60, r: -6,  fly: 'right',  s: 0 },
  { t: 57, r:  7,  fly: 'left',   s: 1 },
  { t: 54, r: -11, fly: 'right',  s: 0 },
  { t: 51, r:  3,  fly: 'bottom', s: 1 },
  // Interactive tap notes
  { t: 48, r: -7,  s: 0 },
  { t: 45, r:  9,  s: 1 },
  { t: 42, r: -4,  s: 0 },
  { t: 39, r:  8,  s: 1 },
  { t: 36, r: -10, s: 0 },
  { t: 33, r:  2,  s: 1 },
  { t: 30, r: -13, s: 0 },
  { t: 27, r:  6,  s: 1 },
];

/* ─── helpers ─── */
function showBtn(el) {
  el.style.animation = 'none';
  el.style.opacity   = '0';
  void el.offsetWidth;                      // force reflow
  el.style.animation = 'btnPop .65s cubic-bezier(.175,.885,.32,1.275) forwards';
  el.addEventListener('animationend', () => {
    el.style.animation = 'btnGlow 2.8s ease-in-out infinite';
  }, { once: true });
}

function hideBtn(el) {
  el.style.animation = 'btnOut .32s ease forwards';
}

/* ─── Phase 1: phone enters ─── */
function phase1() {
  phase = 1;

  ph1.style.animation = 'phEnter 1.25s cubic-bezier(.22,1,.36,1) forwards';

  // Logo slides in
  setTimeout(() => {
    logo.style.animation = 'logoIn .75s ease forwards';
  }, 600);

  // "شروع کن!" appears
  setTimeout(() => {
    phase = 2;
    showBtn(btn1);
    timer = setTimeout(phase2, 2800);   // auto-advance
  }, 1350);
}

/* ─── Phase 2: screen turns purple + "کلیک کن!" ─── */
function phase2() {
  if (phase > 2) return;
  phase = 3;
  clearTimeout(timer);

  hideBtn(btn1);

  // Purple phone cross-fade
  ph2.style.transition = 'opacity .8s ease';
  ph2.style.opacity    = '1';

  // "کلیک کن!" after purple settles
  setTimeout(() => {
    showBtn(btn2);
    timer = setTimeout(phase3, 2800);   // auto-advance
  }, 480);
}

/* ─── Phase 3: banknotes fly in ─── */
function phase3() {
  if (phase >= 4) return;
  phase = 4;
  clearTimeout(timer);

  hideBtn(btn2);

  // Logo fades out gracefully
  logo.style.animation = 'logoOut .9s ease forwards';

  // Fire 4 initial notes
  for (let i = 0; i < 4; i++) {
    setTimeout(() => spawnNote(i, false), i * 370);
  }

  // Enter interactive phase after all notes land
  setTimeout(() => {
    phase = 5;
    // Two gentle flashes to nudge the user
    hint.style.animation = 'screenHint 1.6s ease-in-out 2';
    hint.addEventListener('animationend', () => {
      hint.style.animation = '';
    }, { once: true });
  }, 4 * 370 + 950);
}

/* ─── Spawn a single banknote ─── */
function spawnNote(idx, isTap) {
  if (idx >= stack.length) return;

  const cfg  = stack[idx];
  const note = document.createElement('img');
  note.className = 'note';
  note.src       = srcs[cfg.s];
  note.alt       = '';

  note.style.top     = cfg.t + '%';
  note.style.zIndex  = String(10 + idx);
  note.style.setProperty('--r', cfg.r);

  const anim = isTap ? 'tapDrop'
             : cfg.fly === 'right'  ? 'fromRight'
             : cfg.fly === 'left'   ? 'fromLeft'
             : 'fromBottom';

  note.style.animation =
    `${anim} .88s cubic-bezier(.175,.885,.32,1.275) forwards`;

  scr.appendChild(note);
  noteCount++;
}

/* ─── Interactive tap ─── */
function tapNote(cx, cy) {
  if (noteCount >= MAX) return;

  const rect = stage.getBoundingClientRect();
  const x    = cx - rect.left;
  const y    = cy - rect.top;

  // Ripple
  const rip = document.createElement('div');
  rip.className = 'rip';
  rip.style.left = x + 'px';
  rip.style.top  = y + 'px';
  stage.appendChild(rip);
  setTimeout(() => rip.remove(), 1100);

  // Coin burst
  const numCoins = 7;
  for (let i = 0; i < numCoins; i++) {
    const angle = (i / numCoins) * Math.PI * 2 - Math.PI / 2;
    const dist  = 55 + Math.random() * 50;
    const coin  = document.createElement('div');
    coin.className = 'coin';
    coin.style.left = x + 'px';
    coin.style.top  = y + 'px';
    coin.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    coin.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
    stage.appendChild(coin);
    setTimeout(() => coin.remove(), 900);
  }

  spawnNote(noteCount, true);
}

/* ─── Events ─── */
btn1.addEventListener('click', e => {
  e.stopPropagation();
  if (phase === 2) phase2();
});
btn1.addEventListener('touchstart', e => {
  e.stopPropagation(); e.preventDefault();
  if (phase === 2) phase2();
}, { passive: false });

btn2.addEventListener('click', e => {
  e.stopPropagation();
  if (phase === 3) phase3();
});
btn2.addEventListener('touchstart', e => {
  e.stopPropagation(); e.preventDefault();
  if (phase === 3) phase3();
}, { passive: false });

stage.addEventListener('click', e => {
  if (phase === 5) tapNote(e.clientX, e.clientY);
});
stage.addEventListener('touchstart', e => {
  if (phase === 5) {
    e.preventDefault();
    tapNote(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

/* ─── Start after load ─── */
window.addEventListener('load', () => setTimeout(phase1, 250));
</script>
</body>
</html>
