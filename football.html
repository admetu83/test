<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA World Cup 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(ellipse at center, #0a0a2e 0%, #000000 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Arial Black', Arial, sans-serif;
    }
    canvas { display: block; }
    .title {
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 10px;
      text-shadow: 0 0 20px rgba(255,200,0,0.8);
    }
    .subtitle {
      color: #ffcc00;
      font-size: 0.78rem;
      letter-spacing: 5px;
      margin-top: 5px;
      opacity: 0.9;
    }
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.15; }
      to   { opacity: 0.9; }
    }
    #canvas-container { z-index: 1; }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="canvas-container"></div>
<div class="title" style="z-index:1;position:relative;">World Cup 2026</div>
<div class="subtitle" style="z-index:1;position:relative;">USA &bull; Canada &bull; Mexico</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ── Scene setup ──────────────────────────────────────────────
const W = Math.min(window.innerWidth, 500);
const H = Math.min(window.innerHeight * 0.72, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
camera.position.set(0, 0, 3.8);

// ── Lights ───────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
keyLight.position.set(3, 4, 4);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8899ff, 0.3);
fillLight.position.set(-3, -1, 2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
rimLight.position.set(0, -3, -3);
scene.add(rimLight);

// ── Build soccer ball texture on a canvas ────────────────────
function buildBallTexture(size = 1024) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const S = size;

  // ── Adidas Conext25 – FIFA World Cup 2026 official ball ──
  // Base: white
  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(0, 0, S, S);

  function poly(pts, fill, strokeCol, lw) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0]*S, pts[0][1]*S);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0]*S, pts[i][1]*S);
    ctx.closePath();
    if (fill)     { ctx.fillStyle = fill; ctx.fill(); }
    if (strokeCol){ ctx.strokeStyle = strokeCol; ctx.lineWidth = (lw||3); ctx.stroke(); }
  }

  // ── CONEXT25 geometric star/arrow panels ─────────────────
  // The real ball has bold angular arrow-star shapes in red, blue, black.
  // We replicate the look: 3 large angular "wing" shapes spread around center.

  const RED   = '#e8001c';
  const BLUE  = '#002868';
  const BLACK = '#1a1a1a';
  const SEAM  = 'rgba(60,60,80,0.4)';

  // ── Large star-wings radiating from center ────────────────
  // Wing 1 – pointing upper-right (RED)
  poly([
    [0.50,0.50],[0.56,0.30],[0.75,0.18],[0.80,0.28],
    [0.66,0.38],[0.62,0.50]
  ], RED, null);

  // Wing 2 – pointing lower-right (BLUE)
  poly([
    [0.50,0.50],[0.68,0.58],[0.80,0.75],[0.70,0.82],
    [0.58,0.68],[0.50,0.62]
  ], BLUE, null);

  // Wing 3 – pointing left (BLACK)
  poly([
    [0.50,0.50],[0.30,0.58],[0.14,0.50],[0.14,0.38],
    [0.32,0.44],[0.44,0.50]
  ], BLACK, null);

  // Wing 4 – pointing upper-left (RED, darker)
  poly([
    [0.50,0.50],[0.44,0.30],[0.28,0.18],[0.20,0.28],
    [0.36,0.38],[0.40,0.50]
  ], '#c8001a', null);

  // Wing 5 – pointing lower-left (BLUE lighter)
  poly([
    [0.50,0.50],[0.32,0.62],[0.20,0.78],[0.30,0.84],
    [0.44,0.68],[0.50,0.60]
  ], '#1a3a8a', null);

  // Wing 6 – pointing upper (BLACK)
  poly([
    [0.50,0.50],[0.56,0.28],[0.50,0.06],[0.44,0.28],[0.44,0.50]
  ], '#111', null);

  // Wing 7 – pointing lower (RED-darker)
  poly([
    [0.50,0.50],[0.44,0.74],[0.50,0.96],[0.56,0.74],[0.56,0.50]
  ], '#b50018', null);

  // ── Repeating wrap-around on left/right edges ─────────────
  poly([
    [1.00,0.50],[0.94,0.30],[0.85,0.18],[0.80,0.28],[0.94,0.42],[0.94,0.50]
  ], RED, null);
  poly([
    [0.00,0.50],[0.06,0.30],[0.15,0.18],[0.20,0.28],[0.06,0.42],[0.06,0.50]
  ], RED, null);

  // ── Seam / panel outlines ─────────────────────────────────
  ctx.strokeStyle = SEAM;
  ctx.lineWidth = S * 0.0035;

  // 6-panel curved seams (classic ball feel)
  const seams = [
    // vertical
    [[0.5,0],[0.5,1]],
    // horizontal
    [[0,0.5],[1,0.5]],
    // diagonals
    [[0.25,0],[0.75,1]],[[0.75,0],[0.25,1]],
  ];
  seams.forEach(([a,b]) => {
    ctx.beginPath();
    ctx.moveTo(a[0]*S, a[1]*S);
    // gentle curve through center
    ctx.quadraticCurveTo(S*0.5 + (Math.random()-0.5)*80, S*0.5, b[0]*S, b[1]*S);
    ctx.stroke();
  });

  // Additional curved seams
  [[0,0.25],[0,0.75],[1,0.25],[1,0.75]].forEach(([x,y]) => {
    ctx.beginPath();
    ctx.moveTo(x*S, y*S);
    ctx.quadraticCurveTo(S*0.5, S*0.5, (1-x)*S, (1-y)*S);
    ctx.stroke();
  });

  // ── Adidas 3-stripe logo area ─────────────────────────────
  // Three diagonal stripes (white) top-right area
  ctx.save();
  ctx.translate(S*0.70, S*0.20);
  ctx.rotate(-Math.PI/4);
  for(let i=0; i<3; i++){
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(i*S*0.035, -S*0.04, S*0.022, S*0.09);
  }
  // Adidas trefoil outline below stripes
  ctx.rotate(Math.PI/4);
  ctx.translate(-S*0.70, -S*0.20);
  ctx.restore();

  // ── FIFA WORLD CUP 2026 text ──────────────────────────────
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Shadow
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 6;

  ctx.font = `900 ${S*0.058}px Arial Black, Arial`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('FIFA', S*0.5, S*0.44);

  ctx.font = `900 ${S*0.040}px Arial Black, Arial`;
  ctx.fillStyle = '#ffcc00';
  ctx.fillText('WORLD CUP', S*0.5, S*0.505);

  ctx.font = `900 ${S*0.062}px Arial Black, Arial`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('2026', S*0.5, S*0.575);

  ctx.shadowBlur = 0;
  ctx.restore();

  return new THREE.CanvasTexture(c);
}

// ── Sphere ───────────────────────────────────────────────────
const geo = new THREE.SphereGeometry(1, 64, 64);
const mat = new THREE.MeshStandardMaterial({
  map: buildBallTexture(1024),
  roughness: 0.42,
  metalness: 0.0,
  envMapIntensity: 0.5,
});
const ball = new THREE.Mesh(geo, mat);
scene.add(ball);

// ── Floor shadow (fake) ───────────────────────────────────────
const shadowGeo = new THREE.PlaneGeometry(2.5, 0.6);
const shadowMat = new THREE.MeshBasicMaterial({
  color: 0x000000,
  transparent: true,
  opacity: 0.35,
});
const shadow = new THREE.Mesh(shadowGeo, shadowMat);
shadow.rotation.x = -Math.PI / 2;
shadow.position.set(0, -1.35, 0);
scene.add(shadow);

// ── Animation ────────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.008;

  // slow spin on Y + slight tilt on X
  ball.rotation.y += 0.006;
  ball.rotation.x = Math.sin(t * 0.4) * 0.08;

  // gentle float
  ball.position.y = Math.sin(t) * 0.12;

  // shadow scales with float height
  const scale = 1 - ball.position.y * 0.15;
  shadow.scale.set(scale, scale, 1);
  shadow.material.opacity = 0.35 - ball.position.y * 0.07;

  renderer.render(scene, camera);
}
animate();

// ── Resize ────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const nw = Math.min(window.innerWidth, 500);
  const nh = Math.min(window.innerHeight * 0.72, 500);
  renderer.setSize(nw, nh);
  camera.aspect = nw / nh;
  camera.updateProjectionMatrix();
});

// ── Stars ────────────────────────────────────────────────────
const starsEl = document.getElementById('stars');
for (let i = 0; i < 130; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() * 2.5 + 0.5;
  s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2}s;`;
  starsEl.appendChild(s);
}
</script>
</body>
</html>
