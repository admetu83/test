<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA World Cup 2026 Ball</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at center, #0a0a2e 0%, #000000 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    .scene {
      perspective: 800px;
      width: 260px;
      height: 260px;
    }

    .ball-wrapper {
      width: 260px;
      height: 260px;
      position: relative;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-18px); }
    }

    .ball {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      position: relative;
      animation: spinY 6s linear infinite;
      transform-style: preserve-3d;
    }

    @keyframes spinY {
      from { transform: rotateY(0deg) rotateZ(-8deg); }
      to   { transform: rotateY(360deg) rotateZ(-8deg); }
    }

    /* Base ball with 2026 Adidas "Conext25" inspired colors */
    .ball-surface {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e8e8e8 40%, #c0c0c0 100%);
      position: absolute;
      overflow: hidden;
      box-shadow:
        inset -30px -30px 60px rgba(0,0,0,0.35),
        inset 15px 15px 30px rgba(255,255,255,0.6),
        0 0 60px rgba(255,255,255,0.08),
        0 20px 60px rgba(0,0,0,0.6);
    }

    /* Panels SVG overlay */
    .ball-surface svg {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    /* Shine overlay */
    .ball-surface::after {
      content: '';
      position: absolute;
      top: 10%;
      left: 18%;
      width: 38%;
      height: 28%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.75) 0%, transparent 70%);
      border-radius: 50%;
      transform: rotate(-30deg);
      pointer-events: none;
    }

    /* Shadow under ball */
    .shadow {
      width: 200px;
      height: 30px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, transparent 70%);
      border-radius: 50%;
      margin-top: 10px;
      animation: shadowPulse 3s ease-in-out infinite;
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scaleX(1);   opacity: 0.5; }
      50%       { transform: scaleX(0.75); opacity: 0.25; }
    }

    .title {
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 30px;
      text-shadow: 0 0 20px rgba(255,200,0,0.7);
    }

    .subtitle {
      color: #ffcc00;
      font-size: 0.85rem;
      letter-spacing: 5px;
      margin-top: 6px;
      opacity: 0.85;
    }

    /* Stars background */
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.2; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="scene">
    <div class="ball-wrapper">
      <div class="ball">
        <div class="ball-surface">
          <!-- SVG panels inspired by Adidas World Cup 2026 ball design -->
          <svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <clipPath id="circle-clip">
                <circle cx="130" cy="130" r="128"/>
              </clipPath>
              <radialGradient id="panelGrad1" cx="40%" cy="40%">
                <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#0d0d1a" stop-opacity="0.95"/>
              </radialGradient>
              <radialGradient id="panelGrad2" cx="50%" cy="50%">
                <stop offset="0%" stop-color="#c8102e" stop-opacity="0.88"/>
                <stop offset="100%" stop-color="#8b0000" stop-opacity="0.92"/>
              </radialGradient>
            </defs>

            <g clip-path="url(#circle-clip)">

              <!-- Dark navy panels -->
              <path d="M130,2 C160,2 185,20 200,45 L175,80 L145,65 L130,30 L115,65 L85,80 L60,45 C75,20 100,2 130,2 Z"
                    fill="url(#panelGrad1)" opacity="0.85"/>

              <path d="M258,130 C258,160 240,185 215,200 L180,175 L195,145 L228,130 L195,115 L180,85 L215,60 C240,75 258,100 258,130 Z"
                    fill="url(#panelGrad1)" opacity="0.85"/>

              <path d="M2,130 C2,100 20,75 45,60 L80,85 L65,115 L32,130 L65,145 L80,175 L45,200 C20,185 2,160 2,130 Z"
                    fill="url(#panelGrad1)" opacity="0.85"/>

              <path d="M130,258 C100,258 75,240 60,215 L85,180 L115,195 L130,228 L145,195 L175,180 L200,215 C185,240 160,258 130,258 Z"
                    fill="url(#panelGrad1)" opacity="0.85"/>

              <!-- Red accent panels -->
              <path d="M200,45 L215,60 L180,85 L195,115 L175,80 Z"
                    fill="url(#panelGrad2)" opacity="0.9"/>

              <path d="M60,45 L85,80 L65,115 L45,60 Z"
                    fill="url(#panelGrad2)" opacity="0.9"/>

              <path d="M45,200 L80,175 L65,145 L45,200 Z"
                    fill="url(#panelGrad2)" opacity="0.9"/>

              <path d="M215,200 L180,175 L195,145 L215,200 Z"
                    fill="url(#panelGrad2)" opacity="0.9"/>

              <!-- Panel seam lines -->
              <g fill="none" stroke="rgba(80,80,80,0.5)" stroke-width="1.5">
                <path d="M130,2 C160,2 185,20 200,45"/>
                <path d="M200,45 L175,80 L145,65 L130,30"/>
                <path d="M130,30 L115,65 L85,80 L60,45"/>
                <path d="M60,45 C75,20 100,2 130,2"/>

                <path d="M200,45 L215,60 L180,85 L195,115 L228,130"/>
                <path d="M228,130 L195,145 L180,175 L215,200"/>
                <path d="M215,200 C200,240 160,258 130,258"/>

                <path d="M60,45 L45,60 L80,85 L65,115 L32,130"/>
                <path d="M32,130 L65,145 L80,175 L45,200"/>
                <path d="M45,200 C60,240 100,258 130,258"/>

                <path d="M130,258 L145,195 L175,180 L195,145"/>
                <path d="M130,258 L115,195 L85,180 L65,145"/>

                <path d="M175,80 L195,115 L175,180 L145,195 L115,195 L85,180 L65,115 L85,80 L115,65 L145,65 Z"/>
              </g>

              <!-- FIFA World Cup 2026 text on ball -->
              <text x="130" y="124" text-anchor="middle"
                    font-family="Arial Black, Arial" font-weight="900"
                    font-size="13" fill="rgba(255,255,255,0.95)"
                    letter-spacing="1">FIFA</text>
              <text x="130" y="140" text-anchor="middle"
                    font-family="Arial Black, Arial" font-weight="900"
                    font-size="10.5" fill="rgba(255,200,0,0.95)"
                    letter-spacing="1.5">WORLD CUP</text>
              <text x="130" y="155" text-anchor="middle"
                    font-family="Arial Black, Arial" font-weight="900"
                    font-size="13" fill="rgba(255,255,255,0.95)"
                    letter-spacing="2">2026</text>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="shadow"></div>
  <div class="title">World Cup 2026</div>
  <div class="subtitle">USA &bull; Canada &bull; Mexico</div>

  <script>
    // Generate random stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      star.style.cssText = `
        width:${size}px; height:${size}px;
        top:${Math.random()*100}%;
        left:${Math.random()*100}%;
        animation-delay:${Math.random()*3}s;
        animation-duration:${1.5 + Math.random()*2}s;
      `;
      starsEl.appendChild(star);
    }
  </script>
</body>
</html>
